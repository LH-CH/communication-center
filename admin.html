<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Display Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <div class="admin-shell">
    <header class="admin-header">
      <div>
        <h1>Display Admin</h1>
        <p>Edit configuration and publish directly to GitHub. <span class="version">v3.1</span></p>
      </div>
      <div class="header-actions">
        <span id="connectionStatus">Not connected</span>
        <button id="loadBtn">Load</button>
      </div>
    </header>

    <div class="admin-grid">
      <section class="panel">
        <div class="section-head">
          <h2>Repository access</h2>
          <button id="repoToggle" class="section-toggle" aria-expanded="false">+</button>
        </div>
        <div id="repoSection" class="collapsible collapsed">
          <div class="two-col">
            <label>GitHub owner<input id="owner" value="LH-CH"></label>
            <label>Repository<input id="repo" value="communication-center"></label>
            <label>Branch<input id="branch" value="main"></label>
            <label>Config path<input id="path" value="config.json"></label>
          </div>
          <label>Fine-grained access token
            <div class="token-row">
              <input id="token" type="password" placeholder="github_pat_...">
              <button id="forgetBtn">Forget</button>
            </div>
          </label>
          <label class="remember-row">
            <input id="rememberAccess" type="checkbox">
            <span><strong>Remember repository access on this device</strong><small>Stores the token only in this browser.</small></span>
          </label>
        </div>

        <h2 class="settings-title">Display settings</h2>
        <div id="selectedLocation" class="selected-location">
          <div><strong id="selectedLocationLabel">Kalispell, MT</strong><small id="selectedLocationMeta">America/Denver</small></div>
          <button id="changeLocationBtn">Change</button>
        </div>

        <div id="locationEditor" class="location-editor hidden">
          <label>Display location<input id="locationSearch" placeholder="Start typing a city or ZIP code"></label>
          <div id="locationResults" class="location-results"></div>
          <div class="location-actions"><button id="manualLocationBtn">Set manually</button></div>
          <div id="manualLocationPanel" class="manual-panel hidden">
            <label>Location name<input id="manualLocationLabel"></label>
            <div class="two-col">
              <label>Latitude<input id="manualLatitude" type="number" step="any"></label>
              <label>Longitude<input id="manualLongitude" type="number" step="any"></label>
            </div>
            <label>Time zone
              <select id="manualTimeZone">
                <option value="America/Denver">Mountain Time</option>
                <option value="America/Los_Angeles">Pacific Time</option>
                <option value="America/Chicago">Central Time</option>
                <option value="America/New_York">Eastern Time</option>
                <option value="America/Anchorage">Alaska</option>
                <option value="Pacific/Honolulu">Hawaii</option>
              </select>
            </label>
            <div class="button-row">
              <button id="applyManualLocationBtn" class="primary">Use this location</button>
              <button id="cancelManualLocationBtn">Cancel</button>
            </div>
          </div>
        </div>

        <label>YouTube video URL<input id="youtubeUrl"></label>
        <div class="toggle-row"><span>Show video</span><label class="switch"><input id="showVideo" type="checkbox"><span></span></label></div>
        <div class="toggle-row"><span>Enable notice manager</span><label class="switch"><input id="showNoticeManager" type="checkbox"><span></span></label></div>
      </section>

      <section class="panel notice-panel">
        <div class="notice-head">
          <h2>Notice Manager</h2>
          <button id="addNoticeBtn" class="primary">+ New notice</button>
        </div>
        <div id="noticeDisabled" class="notice-disabled hidden">Notice Manager is turned off. Existing notices remain saved.</div>
        <div id="noticeList"></div>
      </section>
    </div>

    <div class="save-bar">
      <button id="previewBtn">Preview JSON</button>
      <button id="saveBtn" class="primary">Save to GitHub</button>
    </div>
  </div>
  <script type="module" src="admin.js"></script>
</body>
</html>
