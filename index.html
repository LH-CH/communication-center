<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta name="theme-color" content="#020916">
  <title>Display</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <div class="status-strip" aria-live="polite">
      <span id="statusDot" class="status-dot"></span>
      <span id="statusText">LIVE</span>
      <span id="updatedText">Updated --:--</span>
    </div>

    <main class="hero">
      <section class="clock-panel">
        <div class="clock-block">
          <div class="time-line">
            <span id="timeMain">00:00</span>
            <span id="timeSeconds">00</span>
          </div>
          <div id="dateText" class="date-text">Loading date…</div>
        </div>
      </section>

      <section class="video-panel">
        <div class="video-shell">
          <iframe
            id="videoFrame"
            title="Information Feed"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
          <div id="videoFallback" class="video-fallback">Information feed unavailable</div>
        </div>
      </section>
    </main>

    <section id="noticeBanner" class="notice-banner" aria-live="polite">
      <div class="notice-mask">
        <div id="noticeTrack" class="notice-track"></div>
      </div>
      <div id="noticeExpiration" class="notice-expiration"></div>
      <div id="noticeCount" class="notice-count"></div>
    </section>

    <footer class="info-bar">
      <section class="weather-block">
        <div class="weather-summary">
          <div id="weatherIcon" class="weather-icon" aria-hidden="true"></div>
          <div class="weather-primary">
            <div id="temperature" class="temperature">--°F</div>
            <div id="condition" class="condition">Weather unavailable</div>
          </div>
        </div>

        <div class="weather-stats">
          <div class="weather-stat">
            <span class="stat-icon" data-icon="wind"></span>
            <div><span class="stat-label">Wind</span><strong id="wind">--</strong></div>
          </div>
          <div class="weather-stat">
            <span class="stat-icon" data-icon="humidity"></span>
            <div><span class="stat-label">Humidity</span><strong id="humidity">--%</strong></div>
          </div>
          <div class="weather-stat">
            <span class="stat-icon" data-icon="sunrise"></span>
            <div><span class="stat-label">Sunrise</span><strong id="sunrise">--:--</strong></div>
          </div>
          <div class="weather-stat">
            <span class="stat-icon" data-icon="sunset"></span>
            <div><span class="stat-label">Sunset</span><strong id="sunset">--:--</strong></div>
          </div>
        </div>
      </section>

      <section class="alerts-block">
        <div id="alerts" class="alerts">
          <div class="alert-title">Checking weather alerts…</div>
          <div class="alert-detail"></div>
        </div>
      </section>
    </footer>
  </div>

  <script type="module" src="display.js"></script>
</body>
</html>
