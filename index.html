<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Department Clock — Modern Icons</title>
  <meta http-equiv="Cache-Control" content="no-store" />
  <style>
    :root {
      --wx-left-w: 260px;
      --pad: 12px;

      /* NWS colors */
      --warn: #F54927;
      --watch: #F5E027;
      --adv: #F5AD27;
    }

    html, body {
      margin: 0; padding: 0;
      background: #000; color: #fff;
      font-family: Segoe UI Mono, monospace;
      height: 100%; overflow: hidden;
      display: flex; flex-direction: column; justify-content: flex-start; align-items: center;
    }

    /* ==== CLOCK ==== */
    #clock {
      display: flex; align-items: baseline; flex-wrap: wrap;
      font-size: 26vw;             /* fallback — JS will auto-fit */
      margin-top: 4vh;             /* fallback — JS will auto-fit */
    }
    #time-main span { margin: 0; padding: 0; letter-spacing: -0.05em; }
    .colon { margin: 0 0.2vw; }
    #time-seconds { font-size: 7vw; margin-left: 3vw; }
    #date { font-size: 4.5vw; margin-top: 2vh; margin-bottom: 2.2vh; }

    /* ==== ALERTS ==== */
    #alerts {
      position: absolute; left: 10px; right: 10px; bottom: calc( var(--forecast-height, 160px) + 10px );
      display: none;
      background: #000;
      text-align: center;
      border-radius: 8px;
      padding: 6px 12px;
      font: 14px/1.2 Arial, sans-serif;
      overflow: hidden;
      border: 0px solid rgba(255,255,255,0.15);
    }
    #alerts-inner { display: flex; flex-direction: column; will-change: transform; }
    .alert-item {
      padding: 4px 8px; margin: 2px 0;
      border-radius: 6px;
      border: 1px solid; background: transparent;
      font-weight: 600;
    }
    .is-warning  { border-color: var(--warn);  color: var(--warn); }
    .is-watch    { border-color: var(--watch); color: var(--watch); }
    .is-advisory { border-color: var(--adv);   color: var(--adv); }

    /* ==== FORECAST STRIP ==== */
    #forecast-wrap {
      position: absolute; bottom: 0; left: 0; right: 0;
      background: #111;
      padding: var(--pad);
      display: grid;
      grid-template-columns: var(--wx-left-w) 1fr;  /* fixed left | flexible center */
      align-items: center; gap: 14px;
    }

    /* LEFT stack */
    #wx-left {
      display: flex; flex-direction: column; gap: 6px;
      white-space: nowrap; font: 20px/1.2 Arial, sans-serif; color: #ddd;
      min-width: var(--wx-left-w);
      margin-left: 16px; /* spacing from the left edge */
    }
    .info-row { display: flex; align-items: center; gap: 8px; }

    .weather-icon { width: 28px; height: 28px; object-fit: contain; }
    .weather-icon.wind { width: 30px; height: 30px; }

    /* CENTER: hourly forecast */
    #forecast-bar {
      grid-column: 2; min-width: 0;
      white-space: nowrap; overflow-x: auto; overflow-y: hidden;
      display: flex; gap: 10px; justify-content: flex-start; align-items: flex-start;
      min-height: 150px; max-height: 160px; padding: 0 4px;
      scrollbar-width: none;
    }
    #forecast-bar::-webkit-scrollbar { display: none; }

    .forecast-item {
      flex: 0 0 auto; width: 120px;
      text-align: center; color: #fff;
      font-size: 1.05vw; max-width: 22vw;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
    }
    .label-time { font-weight: 800; margin-bottom: 2px; letter-spacing: 0.01em; }

    /* Bigger Temp + Precip */
    .temp-text {
      font: 800 22px/1.2 Arial, sans-serif;  /* bigger temperature */
      margin: 4px 0 0;
    }
    .precip-text {
      font: 700 19px/1.2 Arial, sans-serif;  /* bigger precip chance */
      color: #60a5fa;
      margin-top: 2px;
    }

    .row-rain { display: inline-flex; align-items: center; gap: 6px; }
    .row-rain svg { width: 18px; height: 18px; }
    .row-rain path { fill:#60a5fa; }

    /* Heartbeat */
    #heartbeat { position: absolute; bottom: 10px; right: 10px; width: 12px; height: 12px; background: lime; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.2} }

    /* Modern weather icon styling */
    .wx-icon { width: 64px; height: 64px; }
    .forecast-item .wx-icon { margin: 2px 0 4px; }
    .wx-stroke { stroke: #e5e7eb; stroke-width: 1.75; fill: none; }
    .wx-fill   { fill: #e5e7eb; }
    .wx-accent { fill: #60a5fa; }       /* precip accent */
    .wx-warn   { fill: #f59e0b; }       /* sun/accent */
    .wx-dim    { opacity: .85; }

    @keyframes drip { 0%{transform:translateY(-1px)} 50%{transform:translateY(2px)} 100%{transform:translateY(-1px)} }
    .wx-drop { animation: drip 2.4s ease-in-out infinite; }

    /* Responsive fallback */
    @media (min-width: 1800px){ #clock{font-size:24vw} #time-seconds{font-size:6vw} #date{font-size:4vw} }
    @media (max-width: 1100px) {
      .forecast-item { width: 112px; }
      .wx-icon { width: 56px; height: 56px; }
    }
    @media (max-width: 800px) {
      #clock{font-size:28vw} #time-seconds{font-size:8vw} #date{font-size:5vw}
      .forecast-item{ width: 100px; }
      #wx-left { font-size: 12px; }
      .temp-text { font-size: 18px; }
      .precip-text { font-size: 16px; }
      .wx-icon { width: 52px; height: 52px; }
    }
  </style>
</head>
<body>
  <div id="clock">
    <div id="time-main">
      <span id="hour">00</span><span class="colon">:</span><span id="minute">00</span>
    </div>
    <div id="time-seconds">00</div>
  </div>

  <div id="date">Loading...</div>

  <!-- Alerts banner -->
  <div id="alerts"><div id="alerts-inner"></div></div>

  <!-- Forecast row -->
  <div id="forecast-wrap">
    <!-- LEFT: Sunrise/Sunset/Wind/Humidity (stacked) -->
    <div id="wx-left">
      <div class="info-row">
        <img id="icon-sunrise" class="weather-icon" alt="Sunrise">
        <span>Sunrise <span id="sr-time">--:--</span></span>
      </div>
      <div class="info-row">
        <img id="icon-sunset" class="weather-icon" alt="Sunset">
        <span>Sunset <span id="ss-time">--:--</span></span>
      </div>
      <div class="info-row">
        <img id="icon-wind" class="weather-icon wind" alt="Wind">
        <span id="wind-text">-- mph --</span>
      </div>
      <div class="info-row">
        <img id="icon-humidity" class="weather-icon" alt="Relative Humidity">
        <span id="humidity-text">--%</span>
      </div>
    </div>

    <!-- CENTER: Forecast bar -->
    <div id="forecast-bar">Loading forecast...</div>
  </div>

  <div id="heartbeat" title="Running..."></div>

  <script>
    /* =============== ICON PACK (LOCAL) for left stack =============== */
    const ICON_BASE = './Weather Icons/';
    function setIconSources() {
      const files = {
        'icon-sunrise':  'sunrise-96.png',
        'icon-sunset':   'sunset-96.png',
        'icon-wind':     'wind-96.png',
        'icon-humidity': 'humidity-96.png'
      };
      Object.entries(files).forEach(([id, file]) => {
        const el = document.getElementById(id);
        if (el) el.src = ICON_BASE + file;
      });
    }

    /* =============== CLOCK =============== */
    function updateClock() {
      const now = new Date();
      const [h,m,s] = now.toLocaleTimeString("en-US", { timeZone: "America/Denver", hour12: false }).split(":");
      document.getElementById("hour").textContent = h;
      document.getElementById("minute").textContent = m;
      document.getElementById("time-seconds").textContent = s;

      const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
      const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
      document.getElementById("date").textContent =
        `${days[now.getDay()]} – ${months[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;
    }

    // Auto-fit clock to available space (above forecast strip)
    function fitClock() {
      const clock  = document.getElementById('clock');
      const timeMain = document.getElementById('time-main');
      const secs   = document.getElementById('time-seconds');
      const dateEl = document.getElementById('date');
      const wrap   = document.getElementById('forecast-wrap');

      const pad = 4;
      const barH = wrap ? wrap.offsetHeight : 0;
      const availableH = window.innerHeight - barH - pad * 2;
      const availableW = window.innerWidth  - pad * 2;

      let base = Math.min(availableW * 0.30, availableH * 0.50);
      const apply = f => {
        clock.style.fontSize = f + 'px';
        secs.style.fontSize  = Math.round(f * 0.32) + 'px';
        dateEl.style.fontSize= Math.round(f * 0.22) + 'px';
        clock.style.marginTop= Math.round(f * 0.15) + 'px';
        dateEl.style.marginTop= Math.round(f * 0.12) + 'px';
        dateEl.style.marginBottom= Math.round(f * 0.14) + 'px';
      };
      apply(base);
      for (let i=0;i<25;i++){
        const totalH = clock.offsetHeight + dateEl.offsetHeight + pad;
        const totalW = timeMain.offsetWidth + secs.offsetWidth + pad;
        if (totalH > availableH || totalW > availableW) { base *= 0.96; apply(base); } else break;
      }
    }

    /* =============== SUNRISE/SUNSET (offline calc) =============== */
    const LAT = 48.197, LON = -114.315; // Kalispell
    const deg2rad = x=>x*Math.PI/180, rad2deg = x=>x*180/Math.PI;
    function toDenverLocal(date){
      return date.toLocaleTimeString('en-US', {
        timeZone: 'America/Denver', hour12: false, hour:'2-digit', minute:'2-digit'
      });
    }
    function dayOfYear(d){
      const s=new Date(d.getFullYear(),0,0);
      const diff=d - s + (s.getTimezoneOffset()-d.getTimezoneOffset())*60000;
      return Math.floor(diff/86400000);
    }
    function solarTimes(date, lat, lon){
      const N = dayOfYear(date), lngHour = lon/15;
      function calc(isSunrise){
        const t = N + ((isSunrise?6:18) - lngHour)/24;
        const M = (0.9856*t)-3.289;
        const L = (M + 1.916*Math.sin(deg2rad(M)) + 0.020*Math.sin(deg2rad(2*M)) + 282.634) % 360;
        const RA0 = rad2deg(Math.atan(0.91764*Math.tan(deg2rad(L))));
        const RA = (RA0 + (Math.floor(L/90)*90 - Math.floor(RA0/90)*90))/15;
        const sinDec = 0.39782*Math.sin(deg2rad(L));
        const cosDec = Math.cos(Math.asin(sinDec));
        const cosH = (Math.cos(deg2rad(90.833)) - (sinDec*Math.sin(deg2rad(lat))))/(cosDec*Math.cos(deg2rad(lat)));
        if (cosH < -1 || cosH > 1) return null;
        const Hdeg = rad2deg(Math.acos(cosH));
        const H = (isSunrise ? 360 - Hdeg : Hdeg) / 15;
        const T = H + RA - (0.06571*t) - 6.622;
        const UT = (T - lngHour + 24) % 24;
        return new Date(Date.UTC(
          date.getFullYear(), date.getMonth(), date.getDate(),
          Math.floor(UT), Math.floor((UT%1)*60)
        ));
      }
      return { sunriseUTC: calc(true), sunsetUTC: calc(false) };
    }
    function updateSun(){
      const today = new Date();
      const { sunriseUTC, sunsetUTC } = solarTimes(today, LAT, LON);
      document.getElementById('sr-time').textContent = sunriseUTC ? toDenverLocal(sunriseUTC) : '--:--';
      document.getElementById('ss-time').textContent = sunsetUTC ? toDenverLocal(sunsetUTC) : '--:--';
    }

    /* =============== NOAA: HOURLY FORECAST + NWS ALERTS =============== */
    const POINT_URL = `https://api.weather.gov/points/${LAT},${LON}`;
let cachedHourlyUrl = null;

async function getHourlyForecastUrl() {
  if (cachedHourlyUrl) return cachedHourlyUrl;

  const response = await fetch(POINT_URL, {
    headers: {
      Accept: "application/geo+json"
    }
  });

  if (!response.ok) {
    throw new Error(`NWS point lookup failed: HTTP ${response.status}`);
  }

  const data = await response.json();
  cachedHourlyUrl = data?.properties?.forecastHourly;

  if (!cachedHourlyUrl) {
    throw new Error("NWS did not return an hourly forecast URL");
  }

  return cachedHourlyUrl;
}
    const ALERTS_URL = `https://api.weather.gov/alerts/active?point=${LAT},${LON}&status=actual&message_type=alert`;

    // Modern icon mapping
    function pickIconId(shortForecast = "", isNight = false) {
      const s = shortForecast.toLowerCase();
      if (s.includes("thunder")) return "wx-storm";
      if (s.includes("snow") || s.includes("sleet") || s.includes("flurr")) return "wx-snow";
      if (s.includes("rain") || s.includes("showers") || s.includes("drizzle")) return "wx-rain";
      if (s.includes("fog") || s.includes("mist") || s.includes("haze")) return "wx-fog";
      if (s.includes("wind")) return "wx-wind";
      if (s.includes("cloudy") || s.includes("overcast")) return "wx-cloud";
      if (s.includes("partly") || s.includes("mostly")) return isNight ? "wx-partly-night" : "wx-partly";
      return isNight ? "wx-moon" : "wx-sun";
    }
    function isNightHour(dateObj) {
      const h = dateObj.getHours();
      return (h < 6 || h >= 20);
    }

    const pct = v => (v==null || isNaN(v)) ? '--%' : `${Math.round(v)}%`;
    const makeRainRow = v => `
      <span class="row-rain" title="Chance of Precipitation">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2c-3 4-6 7-6 10a6 6 0 1 0 12 0c0-3-3-6-6-10z"/>
        </svg>
        <span class="precip-text">${pct(v)}</span>
      </span>`;

    function makeItem(label, _iconUrl, shortForecast, temp, pop, whenDate) {
      const iconId = pickIconId(shortForecast, isNightHour(whenDate || new Date()));
      return `
        <div class="forecast-item">
          <div class="label-time">${label}</div>
          <svg class="wx-icon" viewBox="0 0 64 64" aria-hidden="true">
            <use href="#${iconId}"></use>
          </svg>
          <div class="temp-text">${temp}</div>
          ${makeRainRow(pop)}
        </div>`;
    }

    function setWind(speedStr, dirStr){
      const speed = speedStr || '-- mph';
      const dir   = dirStr || '--';
      document.getElementById('wind-text').textContent = `${speed} ${dir}`;
    }
    function setHumidity(rhVal){
      document.getElementById('humidity-text').textContent = `${pct(rhVal)}`;
    }

    function classifyAlert(txt){
      const t = (txt || '').toLowerCase();
      if (t.includes('warning')) return 'is-warning';
      if (t.includes('watch'))   return 'is-watch';
      if (t.includes('advisory'))return 'is-advisory';
      return 'is-advisory';
    }

    let alertItems = [];
    let alertIndex = 0;
    let alertTimer = null;

    function startAlertScroll(){
      const box = document.getElementById('alerts');
      const inner = document.getElementById('alerts-inner');
      if(alertItems.length <= 1){
        clearInterval(alertTimer);
        inner.style.transition = 'none';
        inner.style.transform = 'translateY(0)';
        return;
      }
      clearInterval(alertTimer);
      const stepMs = 4500;
      alertIndex = 0;
      inner.style.transition = 'none';
      inner.style.transform = 'translateY(0)';
      alertTimer = setInterval(()=>{
        alertIndex = (alertIndex + 1) % alertItems.length;
        inner.style.transition = 'transform 600ms ease';
        const itemH = inner.children[0]?.clientHeight || 0;
        inner.style.transform = `translateY(-${alertIndex * (itemH + 4)}px)`;
      }, stepMs);
    }

    async function loadAlerts(){
      try{
        const res = await fetch(ALERTS_URL);
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const feats = data?.features || [];
        const box   = document.getElementById('alerts');
        const inner = document.getElementById('alerts-inner');

        if(feats.length){
          inner.innerHTML = '';
          alertItems = feats.map(f=>{
            const p = f?.properties || {};
            const headline = p.headline || p.event || 'Severe Weather Alert';
            const cls = classifyAlert(headline);
            const div = document.createElement('div');
            div.className = `alert-item ${cls}`;
            div.textContent = headline;
            inner.appendChild(div);
            return {headline, cls};
          });
          box.style.display = 'block';
          startAlertScroll();
        } else {
          box.style.display = 'none';
          inner.innerHTML = '';
          clearInterval(alertTimer);
          alertItems = [];
        }
      }catch{
        const box = document.getElementById('alerts');
        const inner = document.getElementById('alerts-inner');
        box.style.display = 'none';
        inner.innerHTML = '';
        clearInterval(alertTimer);
        alertItems = [];
      }
    }

    function adjustForecastLayout() {
      const bar = document.getElementById('forecast-bar');
      requestAnimationFrame(() => {
        bar.style.justifyContent = (bar.scrollWidth <= bar.clientWidth)
          ? 'space-between' : 'flex-start';
      });
    }

    async function updateNOAAForecast() {
      try {
        const hourlyUrl = await getHourlyForecastUrl();

const response = await fetch(hourlyUrl, {
  headers: {
    Accept: "application/geo+json"
  }
});
        if (!response.ok) throw new Error("Offline or NOAA unavailable");

        let periods = (await response.json()).properties.periods || [];

        // Keep this hour and forward (cap to 12)
        const cut = new Date(); cut.setMinutes(0,0,0);
        periods = periods.filter(p => new Date(p.startTime) >= cut).slice(0, 12);
        if(!periods.length) throw new Error("No upcoming hours");

        const bar = document.getElementById("forecast-bar");
        bar.innerHTML = "";

        // Find period covering "now", else fallback to first future period
        const now = new Date();
        const present = periods.find(p => {
          const st = new Date(p.startTime);
          const et = new Date(p.endTime);
          return now >= st && now < et;
        }) || periods[0];

        // 1) PREPEND Present (left)
        bar.insertAdjacentHTML('beforeend',
          makeItem(
            'Present',
            present.icon,
            present.shortForecast,
            `${present.temperature}°${present.temperatureUnit}`,
            present.probabilityOfPrecipitation?.value,
            new Date(present.startTime)
          )
        );

        // 2) Then render hourly items but SKIP the present's hour block
        periods.forEach(period => {
          if (period.startTime === present.startTime) return;
          const d = new Date(period.startTime);
          const h = String(d.getHours()).padStart(2, '0');
          const m = String(d.getMinutes()).padStart(2, '0');
          bar.insertAdjacentHTML('beforeend',
            makeItem(
              `${h}:${m}`,
              period.icon,
              period.shortForecast,
              `${period.temperature}°${period.temperatureUnit}`,
              period.probabilityOfPrecipitation?.value,
              d
            )
          );
        });

        // Left panel "current" stats from the present period
        setWind(present.windSpeed, present.windDirection);
        setHumidity(present.relativeHumidity?.value);

        fitClock();
        adjustForecastLayout();
        setTimeout(adjustForecastLayout, 150);
      } catch (err) {
        const bar = document.getElementById("forecast-bar");
        bar.innerHTML = `<span style="font-family:Arial,sans-serif;color:#bbb;font-size:14px;">Weather unavailable (${err.message || 'Failed to fetch'})</span>`;
        setWind('-- mph','--');
        setHumidity(null);
        fitClock();
      }
    }

    // === INIT ===
    (function init(){
      // Icons
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', setIconSources);
      } else { setIconSources(); }

      // Clock
      setInterval(updateClock, 1000); updateClock();

      // Reload exactly at top of hour
      (function(){
        const t = new Date();
        const ms = (60 - t.getMinutes())*60000 - t.getSeconds()*1000 - t.getMilliseconds();
        setTimeout(()=>location.reload(), Math.max(0, ms));
      })();

      // Sun times
      updateSun();

      // Weather + Alerts
      updateNOAAForecast();
      loadAlerts();
      setInterval(updateNOAAForecast, 10 * 60 * 1000);
      setInterval(loadAlerts, 5 * 60 * 1000);

      // Layout
      window.addEventListener('load', fitClock);
      window.addEventListener('resize', () => { fitClock(); adjustForecastLayout(); });
    })();
  </script>

  <!-- Inline SVG Sprite (modern, minimal) -->
  <svg width="0" height="0" style="position:absolute;left:-9999px;top:-9999px" aria-hidden="true">
    <!-- Sun -->
    <symbol id="wx-sun" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="12" class="wx-warn"></circle>
      <g class="wx-warn wx-dim">
        <rect x="31" y="6" width="2" height="10" rx="1"></rect>
        <rect x="31" y="48" width="2" height="10" rx="1"></rect>
        <rect x="6" y="31" width="10" height="2" rx="1"></rect>
        <rect x="48" y="31" width="10" height="2" rx="1"></rect>
        <rect x="12" y="12" width="2" height="10" transform="rotate(-45 13 17)"></rect>
        <rect x="50" y="42" width="2" height="10" transform="rotate(-45 51 47)"></rect>
        <rect x="42" y="12" width="2" height="10" transform="rotate(45 43 17)"></rect>
        <rect x="12" y="42" width="2" height="10" transform="rotate(45 13 47)"></rect>
      </g>
    </symbol>

    <!-- Moon -->
    <symbol id="wx-moon" viewBox="0 0 64 64">
      <path class="wx-fill wx-dim" d="M40 10a18 18 0 1 0 8 34a16 16 0 1 1 -8 -34z"></path>
    </symbol>

    <!-- Partly Cloudy (day) -->
    <symbol id="wx-partly" viewBox="0 0 64 64">
      <use href="#wx-sun"></use>
      <path class="wx-fill" d="M20 44h26a8 8 0 0 0 0-16c-.6 0-1.2.05-1.8.16A12 12 0 0 0 20 32a8 8 0 0 0 0 12z"></path>
    </symbol>

    <!-- Partly Cloudy (night) -->
    <symbol id="wx-partly-night" viewBox="0 0 64 64">
      <use href="#wx-moon"></use>
      <path class="wx-fill" d="M20 44h26a8 8 0 0 0 0-16c-.6 0-1.2.05-1.8.16A12 12 0 0 0 20 32a8 8 0 0 0 0 12z"></path>
    </symbol>

    <!-- Cloud -->
    <symbol id="wx-cloud" viewBox="0 0 64 64">
      <path class="wx-fill" d="M18 46h28a10 10 0 0 0 0-20c-.8 0-1.6.08-2.3.24A14 14 0 0 0 18 28a10 10 0 0 0 0 18z"></path>
    </symbol>

    <!-- Rain -->
    <symbol id="wx-rain" viewBox="0 0 64 64">
      <use href="#wx-cloud"></use>
      <circle cx="24" cy="52" r="3" class="wx-accent wx-drop"></circle>
      <circle cx="36" cy="56" r="3" class="wx-accent wx-drop" style="animation-delay:.3s"></circle>
      <circle cx="48" cy="52" r="3" class="wx-accent wx-drop" style="animation-delay:.15s"></circle>
    </symbol>

    <!-- Snow -->
    <symbol id="wx-snow" viewBox="0 0 64 64">
      <use href="#wx-cloud"></use>
      <path class="wx-fill" d="M24 56l2-6 2 6-6-2 6-2-6 2zM36 56l2-6 2 6-6-2 6-2-6 2zM48 56l2-6 2 6-6-2 6-2-6 2z"></path>
    </symbol>

    <!-- Thunderstorm -->
