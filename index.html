<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Communication Center</title>
  <style>
    :root{
      --bg:#020b19;--panel:rgba(3,16,32,.76);--line:rgba(132,169,204,.28);
      --text:#f3f7fb;--muted:#aebfd0;--accent:#38bdf8;--ok:#53d18d;
      --warn:#f59e0b;--danger:#ef4444;--pad:clamp(12px,1.15vw,22px);
      --gap:clamp(10px,1vw,18px);--radius:clamp(8px,.7vw,13px);
      --header-h:clamp(48px,5.7vh,70px);--footer-h:clamp(145px,20vh,220px);
    }
    *{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{font-family:Segoe UI,Arial,sans-serif;color:var(--text);background:var(--bg);font-variant-numeric:tabular-nums}
    body::before{content:"";position:fixed;inset:0;background:linear-gradient(rgba(0,10,24,.80),rgba(0,10,24,.90)),var(--background-image,none) center/cover no-repeat;z-index:-1}
    .app{height:100dvh;min-height:100vh;padding:var(--pad);display:grid;grid-template-rows:var(--header-h) minmax(0,1fr) var(--footer-h);gap:var(--gap)}
    header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);min-width:0}
    .brand{font-size:clamp(18px,1.45vw,29px);font-weight:700;letter-spacing:.025em;white-space:nowrap}
    .statusbar{display:flex;align-items:center;gap:clamp(10px,1.2vw,22px);font-size:clamp(11px,.78vw,15px);color:var(--muted);white-space:nowrap}
    .status{display:flex;align-items:center;gap:7px;font-weight:700;color:var(--text)}
    .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}.status.delayed .dot{background:var(--warn)}.status.error .dot{background:var(--danger)}
    main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:var(--gap);min-height:0}
    .clock-panel,.video-panel{min-width:0;min-height:0}
    .clock-panel{display:flex;align-items:center;justify-content:center}
    .clock-wrap{width:100%;padding-inline:clamp(4px,2vw,34px)}
    .time-row{display:flex;align-items:flex-start;justify-content:center;white-space:nowrap;line-height:.82}
    #time{font-size:clamp(100px,20vw,390px);font-weight:650;letter-spacing:-.07em}
    #seconds{font-size:clamp(28px,4.2vw,82px);font-weight:600;color:var(--muted);margin:.05em 0 0 .2em}
    #date{margin-top:clamp(20px,3vh,42px);font-size:clamp(21px,2vw,40px);font-weight:600;color:#d6e1ec;text-align:left}
    .video-panel{display:flex;align-items:center;justify-content:center}
    .video-shell{width:100%;max-height:100%;aspect-ratio:16/9;position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:rgba(2,12,25,.88)}
    #videoFrame{width:100%;height:100%;display:block;border:0}.video-fallback{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:clamp(16px,1.25vw,24px);background:rgba(2,12,25,.98)}
    footer{display:grid;grid-template-columns:minmax(270px,1fr) minmax(360px,1.45fr) minmax(260px,1fr);gap:var(--gap);border-top:1px solid var(--line);padding-top:var(--gap);min-height:0}
    .footer-section{min-width:0;min-height:0;display:flex;align-items:center}
    .current{gap:clamp(12px,1.2vw,22px)}.current-icon{width:clamp(56px,4.7vw,88px);height:clamp(56px,4.7vw,88px);object-fit:contain}
    .temp{font-size:clamp(42px,4.4vw,86px);font-weight:650;line-height:.95}.condition{font-size:clamp(13px,1vw,20px);color:var(--muted);margin-top:8px;max-width:240px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 18px;margin-left:auto;font-size:clamp(11px,.82vw,16px);color:var(--muted)}.metric b{display:block;color:var(--text);font-weight:600;margin-top:2px}
    .notice{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:clamp(12px,1vw,18px);font-size:clamp(16px,1.15vw,23px);line-height:1.35;display:flex;align-items:center;justify-content:center;text-align:center;min-height:70px;position:relative}.notice.important{border-left:4px solid var(--warn)}.notice.urgent{border-left:4px solid var(--danger)}
    .notice-count{position:absolute;right:10px;bottom:7px;color:var(--muted);font-size:11px}
    .alerts{width:100%;padding-left:clamp(8px,1vw,18px)}.alert-title{font-size:clamp(16px,1.25vw,24px);font-weight:650}.alert-detail{font-size:clamp(12px,.9vw,17px);color:var(--muted);margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.alerts.warning{border-left:4px solid var(--danger)}.alerts.watch{border-left:4px solid #facc15}.alerts.advisory{border-left:4px solid var(--warn)}
    .forecast-strip{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(var(--footer-h) + var(--gap) + var(--pad));display:none;grid-template-columns:repeat(var(--forecast-count,6),1fr);gap:8px;pointer-events:none}
    .forecast-item{background:rgba(3,16,32,.90);border:1px solid var(--line);border-radius:9px;padding:8px;text-align:center;font-size:clamp(10px,.72vw,14px)}.forecast-item img{width:clamp(28px,2.4vw,46px);height:clamp(28px,2.4vw,46px)}.forecast-temp{font-size:clamp(15px,1.1vw,22px);font-weight:650}.forecast-pop{color:#7dd3fc}
    @media(max-width:1500px){:root{--footer-h:150px}.statusbar .optional{display:none}.metrics{gap:5px 10px}.forecast-strip{display:none!important}}
    @media(min-width:1900px){.forecast-strip.ready{display:grid}main{padding-bottom:clamp(70px,8vh,110px)}}
    @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
<div class="app">
  <header>
    <div id="brand" class="brand">COMMUNICATION CENTER</div>
    <div class="statusbar">
      <div id="status" class="status"><span class="dot"></span><span id="statusText">LIVE</span></div>
      <span id="updated">Updated --:--</span>
      <span class="optional">NWS</span>
    </div>
  </header>
  <main>
    <section class="clock-panel">
      <div class="clock-wrap">
        <div class="time-row"><div id="time">00:00</div><div id="seconds">00</div></div>
        <div id="date">Loading date…</div>
      </div>
    </section>
    <section class="video-panel">
      <div class="video-shell">
        <iframe id="videoFrame" title="Information Feed" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div id="videoFallback" class="video-fallback">Information feed unavailable</div>
      </div>
    </section>
  </main>
  <footer>
    <section class="footer-section current">
      <img id="currentIcon" class="current-icon" src="windsock.gif" alt="Current weather">
      <div><div id="temperature" class="temp">--°F</div><div id="condition" class="condition">Weather unavailable</div></div>
      <div class="metrics">
        <div class="metric">Wind<b id="wind">--</b></div><div class="metric">Humidity<b id="humidity">--%</b></div>
        <div class="metric">Sunrise<b id="sunrise">--:--</b></div><div class="metric">Sunset<b id="sunset">--:--</b></div>
      </div>
    </section>
    <section class="footer-section"><div id="notice" class="notice">No active department notices</div></section>
    <section class="footer-section"><div id="alerts" class="alerts"><div class="alert-title">Checking weather alerts…</div><div class="alert-detail"></div></div></section>
  </footer>
</div>
<div id="forecast" class="forecast-strip"></div>
<script>
'use strict';
let CONFIG={};let currentConfigText='';let noticeTimer=null;let activeNoticeIndex=0;let weatherBusy=false;let alertsBusy=false;let hourlyUrl='';let stationsUrl='';let stationId='';
const $=id=>document.getElementById(id);const cacheKey='cc-weather-v3';const alertCacheKey='cc-alerts-v3';
const fetchJson=async(url,timeout=12000)=>{const c=new AbortController();const t=setTimeout(()=>c.abort(),timeout);try{const r=await fetch(url,{headers:{Accept:'application/geo+json'},cache:'no-store',signal:c.signal});if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);return await r.json()}finally{clearTimeout(t)}};
function setStatus(type,text){$('status').className='status '+(type||'');$('statusText').textContent=text}
function fmtTime(d,tz){return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(d)}
function updateClock(){const tz=CONFIG.timeZone||'America/Denver',now=new Date();const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now);const get=t=>parts.find(p=>p.type===t)?.value||'00';$('time').textContent=`${get('hour')}:${get('minute')}`;$('seconds').textContent=get('second');$('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now)}
function youtubeId(v=''){v=v.trim();if(/^[\w-]{11}$/.test(v))return v;try{const u=new URL(v);if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';if(u.pathname.startsWith('/embed/')||u.pathname.startsWith('/live/'))return u.pathname.split('/')[2]||'';return u.searchParams.get('v')||''}catch{return ''}}
function setVideo(){const f=$('videoFrame'),fb=$('videoFallback'),id=youtubeId(CONFIG.youtubeUrl||'');if(!CONFIG.showVideo||!id){f.removeAttribute('src');f.style.display='none';fb.style.display='flex';return}f.style.display='block';fb.style.display='none';f.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&loop=1&playlist=${id}`}
function activeNotices(){const now=Date.now();const rank={urgent:0,important:1,normal:2};return (CONFIG.notices||[]).filter(n=>n.message?.trim()&&(!n.start||new Date(n.start).getTime()<=now)&&(!n.expires||new Date(n.expires).getTime()>now)).sort((a,b)=>(rank[a.priority||'normal']??2)-(rank[b.priority||'normal']??2))}
function renderNotice(){const list=activeNotices(),el=$('notice');if(!list.length){el.className='notice';el.textContent='No active department notices';return}activeNoticeIndex%=list.length;const n=list[activeNoticeIndex];el.className=`notice ${n.priority||'normal'}`;el.innerHTML=`<span>${escapeHtml(n.message)}</span>${list.length>1?`<span class="notice-count">${activeNoticeIndex+1} of ${list.length}</span>`:''}`;activeNoticeIndex=(activeNoticeIndex+1)%list.length}
function escapeHtml(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function startNoticeRotation(){clearInterval(noticeTimer);activeNoticeIndex=0;renderNotice();noticeTimer=setInterval(renderNotice,Math.max(5,CONFIG.noticeRotationSeconds||10)*1000)}
async function loadConfig(initial=false){try{const r=await fetch(`config.json?v=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw new Error(r.status);const text=await r.text();if(text===currentConfigText&&!initial)return;currentConfigText=text;CONFIG=JSON.parse(text);$('brand').textContent=CONFIG.facilityName||'COMMUNICATION CENTER';document.documentElement.style.setProperty('--background-image',`url("${CONFIG.backgroundImage||'background.png'}")`);setVideo();startNoticeRotation();if(initial||!hourlyUrl)await refreshWeather(true)}catch(e){console.error('Config',e);if(!Object.keys(CONFIG).length)setStatus('error','CONFIG ERROR')}}
const cToF=c=>Math.round(c*9/5+32),kphToMph=k=>Math.round(k*.621371),dir=d=>{if(d==null)return'--';return['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8]};
function solar(date,lat,lon,rise){const N=Math.floor((Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate())-Date.UTC(date.getUTCFullYear(),0,0))/86400000),lng=lon/15,t=N+((rise?6:18)-lng)/24,M=.9856*t-3.289,L=(M+1.916*Math.sin(M*Math.PI/180)+.020*Math.sin(2*M*Math.PI/180)+282.634+360)%360,RA=(Math.atan(.91764*Math.tan(L*Math.PI/180))*180/Math.PI+360)%360,RAh=(RA+(Math.floor(L/90)*90-Math.floor(RA/90)*90))/15,sinDec=.39782*Math.sin(L*Math.PI/180),cosDec=Math.cos(Math.asin(sinDec)),cosH=(Math.cos(90.833*Math.PI/180)-sinDec*Math.sin(lat*Math.PI/180))/(cosDec*Math.cos(lat*Math.PI/180));if(Math.abs(cosH)>1)return null;const H=(rise?360-Math.acos(cosH)*180/Math.PI:Math.acos(cosH)*180/Math.PI)/15,T=H+RAh-.06571*t-6.622,UT=(T-lng+24)%24;return new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate(),Math.floor(UT),Math.round((UT%1)*60)))}
function renderWeather(w,cached=false){$('temperature').textContent=w.tempF==null?'--°F':`${w.tempF}°F`;$('condition').textContent=w.description||'Weather unavailable';$('wind').textContent=w.wind||'--';$('humidity').textContent=w.humidity==null?'--%':`${Math.round(w.humidity)}%`;$('updated').textContent=`Updated ${w.updated?fmtTime(new Date(w.updated),CONFIG.timeZone):'--:--'}`;const lat=CONFIG.location?.latitude,lon=CONFIG.location?.longitude;if(Number.isFinite(lat)&&Number.isFinite(lon)){$('sunrise').textContent=fmtTime(solar(new Date(),lat,lon,true),CONFIG.timeZone);$('sunset').textContent=fmtTime(solar(new Date(),lat,lon,false),CONFIG.timeZone)}renderForecast(w.periods||[]);setStatus(cached?'delayed':'',cached?'WEATHER DELAYED':'LIVE')}
function renderForecast(periods){const n=Math.min(CONFIG.forecastHours||6,periods.length),el=$('forecast');el.style.setProperty('--forecast-count',n);el.innerHTML=periods.slice(0,n).map(p=>`<div class="forecast-item"><div>${fmtTime(new Date(p.startTime),CONFIG.timeZone)}</div><img src="${p.icon||''}" alt=""><div class="forecast-temp">${p.temperature}°</div><div class="forecast-pop">${p.probabilityOfPrecipitation?.value??0}%</div></div>`).join('');el.classList.toggle('ready',n>0)}
async function refreshWeather(force=false){if(weatherBusy)return;const lat=CONFIG.location?.latitude,lon=CONFIG.location?.longitude;if(!Number.isFinite(lat)||!Number.isFinite(lon)){setStatus('error','LOCATION REQUIRED');return}weatherBusy=true;try{if(force||!hourlyUrl||!stationsUrl){const p=await fetchJson(`https://api.weather.gov/points/${lat},${lon}`);hourlyUrl=p.properties.forecastHourly;stationsUrl=p.properties.observationStations;if(p.properties.timeZone&&!CONFIG.timeZone)CONFIG.timeZone=p.properties.timeZone}const [hourly,stations]=await Promise.all([fetchJson(hourlyUrl),stationId?Promise.resolve(null):fetchJson(stationsUrl)]);if(!stationId){const first=stations?.features?.[0]?.properties?.stationIdentifier;stationId=first||''}const obs=stationId?await fetchJson(`https://api.weather.gov/stations/${stationId}/observations/latest`):null;const op=obs?.properties||{},periods=hourly?.properties?.periods||[],present=periods[0]||{};const tempC=op.temperature?.value,windKph=op.windSpeed?.value,humidity=op.relativeHumidity?.value,w={tempF:tempC==null?present.temperature:cToF(tempC),description:op.textDescription||present.shortForecast,wind:windKph==null?`${present.windSpeed||'--'} ${present.windDirection||''}`.trim():`${kphToMph(windKph)} mph ${dir(op.windDirection?.value)}`,humidity,updated:op.timestamp||new Date().toISOString(),periods};localStorage.setItem(cacheKey,JSON.stringify(w));renderWeather(w,false)}catch(e){console.error('Weather',e);const c=localStorage.getItem(cacheKey);if(c)renderWeather(JSON.parse(c),true);else{setStatus('error','CONNECTION ERROR');$('condition').textContent='Weather unavailable'}}finally{weatherBusy=false}}
function classifyAlert(a){const s=(a.severity||'').toLowerCase(),e=(a.event||'').toLowerCase();if(s==='extreme'||s==='severe'||e.includes('warning'))return'warning';if(e.includes('watch'))return'watch';if(e.includes('advisory'))return'advisory';return''}
function renderAlerts(list,cached=false){const el=$('alerts');if(!list.length){el.className='alerts';el.innerHTML='<div class="alert-title">✓ No Active Weather Alerts</div><div class="alert-detail"></div>';return}const a=list[0];el.className=`alerts ${classifyAlert(a)}`;el.innerHTML=`<div class="alert-title">${escapeHtml(a.event||'Weather Alert')}</div><div class="alert-detail">${escapeHtml(a.headline||'')}${cached?' · Delayed':''}</div>`}
async function refreshAlerts(){if(alertsBusy)return;const lat=CONFIG.location?.latitude,lon=CONFIG.location?.longitude;if(!Number.isFinite(lat)||!Number.isFinite(lon))return;alertsBusy=true;try{const d=await fetchJson(`https://api.weather.gov/alerts/active?point=${lat},${lon}&status=actual`);const list=(d.features||[]).map(f=>f.properties||{});localStorage.setItem(alertCacheKey,JSON.stringify(list));renderAlerts(list,false)}catch(e){console.error('Alerts',e);const c=localStorage.getItem(alertCacheKey);if(c)renderAlerts(JSON.parse(c),true);else $('alerts').innerHTML='<div class="alert-title">Weather alerts unavailable</div><div class="alert-detail"></div>'}finally{alertsBusy=false}}
function init(){const wc=localStorage.getItem(cacheKey),ac=localStorage.getItem(alertCacheKey);if(wc)renderWeather(JSON.parse(wc),true);if(ac)renderAlerts(JSON.parse(ac),true);updateClock();setInterval(updateClock,1000);loadConfig(true).then(()=>refreshAlerts());setInterval(()=>loadConfig(false),30000);setInterval(()=>refreshWeather(false),600000);setInterval(refreshAlerts,300000);setInterval(()=>location.reload(),3600000)}
init();
</script>
</body>
</html>
