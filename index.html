<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Dashboard</title>
  <style>
    :root{
      --bg:#020916;
      --panel:#061222;
      --line:rgba(159,185,211,.18);
      --text:#f4f7fb;
      --muted:#9fb0c2;
      --accent:#65c7f7;
      --ok:#55d897;
      --warn:#f2b84b;
      --danger:#ef6666;
      --pad:clamp(16px,1.4vw,28px);
      --gap:clamp(16px,1.3vw,26px);
      --radius:clamp(8px,.65vw,12px);
      --footer-h:clamp(150px,20vh,220px);
    }

    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden}
    body{
      --sky-top:#020916;
      --sky-bottom:#020b18;
      --sky-glow:rgba(101,199,247,.035);
      font-family:Segoe UI,Arial,sans-serif;
      color:var(--text);
      background:
        radial-gradient(circle at 15% 10%,var(--sky-glow),transparent 30%),
        linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%);
      font-variant-numeric:tabular-nums;
      transition:background 60s linear;
    }

    .app{
      height:100dvh;
      min-height:100vh;
      padding:var(--pad);
      display:grid;
      grid-template-rows:minmax(0,1fr) var(--footer-h);
      gap:var(--gap);
      position:relative;
    }

    .statusbar{
      position:absolute;
      top:calc(var(--pad) + 2px);
      right:var(--pad);
      z-index:10;
      display:flex;
      align-items:center;
      gap:clamp(10px,.9vw,16px);
      color:var(--muted);
      font-size:clamp(11px,.72vw,14px);
      letter-spacing:.01em;
      white-space:nowrap;
    }

    .status{
      display:flex;
      align-items:center;
      gap:7px;
      color:#dce7f1;
      font-weight:600;
    }

    .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
    .status.delayed .dot{background:var(--warn)}
    .status.error .dot{background:var(--danger)}

    main{
      display:grid;
      grid-template-columns:minmax(0,.96fr) minmax(0,1.04fr);
      gap:clamp(24px,2.5vw,52px);
      min-height:0;
      padding-top:clamp(22px,3vh,44px);
    }

    .clock-panel,.video-panel{min-width:0;min-height:0}
    .clock-panel{display:flex;align-items:center;justify-content:center}
    .clock-wrap{width:100%;padding-inline:clamp(6px,1.6vw,28px)}
    .time-row{display:flex;align-items:flex-start;justify-content:center;white-space:nowrap;line-height:.84}
    #time{font-size:clamp(104px,18.7vw,360px);font-weight:620;letter-spacing:-.065em}
    #seconds{font-size:clamp(27px,3.7vw,72px);font-weight:500;color:var(--muted);margin:.08em 0 0 .22em}
    #date{
      margin-top:clamp(22px,3vh,40px);
      font-size:clamp(19px,1.65vw,32px);
      font-weight:500;
      color:#c9d5e1;
      text-align:center;
    }

    .video-panel{display:flex;align-items:center;justify-content:center}
    .video-shell{
      width:100%;
      max-height:100%;
      aspect-ratio:16/9;
      position:relative;
      border:1px solid rgba(159,185,211,.14);
      border-radius:var(--radius);
      overflow:hidden;
      background:#04101f;
    }

    #videoFrame{width:100%;height:100%;display:block;border:0}
    .video-fallback{
      position:absolute;inset:0;display:none;align-items:center;justify-content:center;
      color:var(--muted);font-size:clamp(16px,1.2vw,23px);background:var(--panel)
    }

    footer{
      display:grid;
      grid-template-columns:minmax(560px,1.45fr) minmax(360px,1fr);
      gap:clamp(26px,2.4vw,48px);
      border-top:1px solid rgba(159,185,211,.14);
      padding-top:clamp(18px,1.4vw,28px);
      min-height:0;
    }

    footer.notice-disabled .notice-section{
      display:none;
    }

    .footer-section{min-width:0;min-height:0;display:flex;align-items:center}

    .current{
      display:grid;
      grid-template-columns:minmax(220px,.95fr) minmax(230px,1.05fr);
      align-items:center;
      column-gap:clamp(52px,4.6vw,96px);
      width:100%;
    }

    .weather-summary{
      display:grid;
      grid-template-columns:auto minmax(0,1fr);
      align-items:center;
      column-gap:clamp(18px,1.35vw,26px);
      min-width:0;
    }

    .weather-icon{
      width:clamp(50px,3.7vw,66px);
      height:clamp(50px,3.7vw,66px);
      color:#dce8f2;
      flex:none;
    }

    .weather-copy{min-width:0}
    .weather-icon svg,.metric-icon svg{width:100%;height:100%;display:block}

    .temp{
      font-size:clamp(52px,4.4vw,82px);
      font-weight:600;
      letter-spacing:-.035em;
      line-height:.88;
      white-space:nowrap;
    }

    .condition{
      font-size:clamp(17px,1.15vw,22px);
      color:var(--muted);
      margin-top:clamp(8px,.65vw,12px);
      max-width:220px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .metrics{
      display:grid;
      grid-template-columns:repeat(2,minmax(92px,1fr));
      column-gap:clamp(28px,2.4vw,48px);
      row-gap:clamp(18px,1.5vw,28px);
      width:100%;
      font-size:clamp(14px,.95vw,18px);
      color:var(--muted);
    }

    .metric{
      display:grid;
      grid-template-columns:18px minmax(0,1fr);
      grid-template-rows:auto auto;
      column-gap:9px;
      align-items:center;
      min-width:0;
    }

    .metric-icon{
      width:17px;
      height:17px;
      color:#89a9c0;
      grid-row:1 / span 2;
      align-self:center;
    }

    .metric span:last-child{
      display:block;
      line-height:1.15;
      white-space:nowrap;
    }

    .metric b{
      display:block;
      color:var(--text);
      font-size:clamp(17px,1.16vw,22px);
      font-weight:600;
      line-height:1.15;
      margin-top:4px;
      white-space:nowrap;
    }

    .notice-banner{
      position:absolute;
      left:var(--pad);
      right:var(--pad);
      bottom:calc(var(--footer-h) + var(--gap) + 8px);
      min-height:clamp(76px,8.8vh,108px);
      border:1px solid rgba(159,185,211,.16);
      border-radius:var(--radius);
      background:rgba(5,17,31,.94);
      backdrop-filter:blur(8px);
      overflow:hidden;
      opacity:0;
      transform:translateY(12px);
      pointer-events:none;
      transition:opacity .28s ease,transform .28s ease;
      box-shadow:0 14px 34px rgba(0,0,0,.18);
      z-index:10;
    }

    .notice-banner.active{
      opacity:1;
      transform:translateY(0);
    }

    .notice-banner-mask{
      position:absolute;
      inset:0;
      overflow:hidden;
      -webkit-mask-image:linear-gradient(
        to bottom,
        transparent 0%,
        #000 18%,
        #000 82%,
        transparent 100%
      );
      mask-image:linear-gradient(
        to bottom,
        transparent 0%,
        #000 18%,
        #000 82%,
        transparent 100%
      );
    }

    .notice-track{
      position:absolute;
      left:0;
      right:0;
      top:50%;
      display:flex;
      flex-direction:column;
      gap:clamp(8px,.7vw,12px);
      padding:0 clamp(24px,2vw,38px);
      transform:translateY(var(--notice-offset,-50%));
      transition:transform 700ms cubic-bezier(.22,.61,.36,1);
      will-change:transform;
    }

    .notice-item{
      flex:0 0 auto;
      min-height:clamp(46px,5.3vh,62px);
      display:flex;
      align-items:center;
      justify-content:center;
      padding:10px clamp(44px,3.5vw,72px);
      border-left:3px solid transparent;
      border-radius:7px;
      color:rgba(244,247,251,.42);
      text-align:center;
      font-size:clamp(16px,1.08vw,21px);
      line-height:1.3;
      opacity:.42;
      transform:scale(.975);
      transition:
        opacity 700ms ease,
        transform 700ms ease,
        color 700ms ease,
        background-color 700ms ease;
    }

    .notice-item.active{
      color:var(--text);
      opacity:1;
      transform:scale(1);
      background:rgba(8,24,41,.56);
    }

    .notice-item.important{border-left-color:var(--warn)}
    .notice-item.urgent{border-left-color:var(--danger)}

    .notice-expiration{
      position:absolute;
      left:12px;
      bottom:7px;
      z-index:3;
      color:rgba(159,176,194,.72);
      font-size:clamp(10px,.68vw,12px);
      letter-spacing:.01em;
      pointer-events:none;
      white-space:nowrap;
    }

    .notice-count{
      position:absolute;
      right:10px;
      bottom:7px;
      z-index:3;
      color:var(--muted);
      font-size:11px;
      pointer-events:none;
    }

    .alert-section{
      border-left:1px solid rgba(159,185,211,.12);
      padding-left:clamp(22px,1.8vw,34px);
    }

    .alerts{width:100%;padding-left:0}
    .alert-title{font-size:clamp(17px,1.18vw,23px);font-weight:600}
    .alert-detail{
      font-size:clamp(14px,.95vw,18px);
      color:var(--muted);
      margin-top:6px;
      display:-webkit-box;
      -webkit-line-clamp:2;
      -webkit-box-orient:vertical;
      overflow:hidden;
    }

    .alerts.warning{border-left:3px solid var(--danger)}
    .alerts.watch{border-left:3px solid #f5d34f}
    .alerts.advisory{border-left:3px solid var(--warn)}

    @media(max-width:1500px){
      :root{--footer-h:150px}
      .current{
        grid-template-columns:minmax(190px,.9fr) minmax(210px,1.1fr);
        column-gap:36px;
      }
      .weather-summary{column-gap:16px}
      .metrics{column-gap:22px;row-gap:14px}
      main{padding-top:28px}
    }

    @media(prefers-reduced-motion:reduce){
      *{animation:none!important;transition:none!important}
      .notice-track,.notice-item{transition:none!important}
    }
  </style>
</head>
<body>
<div class="app">
  <div class="statusbar" aria-live="polite">
    <div id="status" class="status"><span class="dot"></span><span id="statusText">LIVE</span></div>
    <span id="updated">Updated --:--</span>
  </div>

  <main>
    <section class="clock-panel">
      <div class="clock-wrap">
        <div class="time-row"><div id="time">00:00</div><div id="seconds">00</div></div>
        <div id="date">Loading date…</div>
      </div>
    </section>

    <section class="video-panel">
      <div class="video-shell">
        <iframe id="videoFrame" title="Information Feed" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <div id="videoFallback" class="video-fallback">Information feed unavailable</div>
      </div>
    </section>
  </main>

  
  <section id="noticeBanner" class="notice-banner" aria-live="polite">
    <div class="notice-banner-mask">
      <div id="noticeTrack" class="notice-track"></div>
    </div>
    <span id="noticeExpiration" class="notice-expiration"></span>
    <span id="noticeCount" class="notice-count"></span>
  </section>

<footer id="dashboardFooter">
<section class="footer-section current weather-section">
      <div class="weather-summary">
        <div id="currentIcon" class="weather-icon" aria-label="Current weather"></div>
        <div class="weather-copy">
          <div id="temperature" class="temp">--°F</div>
          <div id="condition" class="condition">Weather unavailable</div>
        </div>
      </div>

      <div class="metrics">
        <div class="metric">
          <span class="metric-icon" data-icon="wind"></span>
          <span>Wind<b id="wind">--</b></span>
        </div>
        <div class="metric">
          <span class="metric-icon" data-icon="humidity"></span>
          <span>Humidity<b id="humidity">--%</b></span>
        </div>
        <div class="metric">
          <span class="metric-icon" data-icon="sunrise"></span>
          <span>Sunrise<b id="sunrise">--:--</b></span>
        </div>
        <div class="metric">
          <span class="metric-icon" data-icon="sunset"></span>
          <span>Sunset<b id="sunset">--:--</b></span>
        </div>
      </div>
    </section>
<section class="footer-section alert-section">
      <div id="alerts" class="alerts">
        <div class="alert-title">Checking weather alerts…</div>
        <div class="alert-detail"></div>
      </div>
    </section>
</footer>
</div>

<script>
'use strict';

let CONFIG={};
let currentConfigText='';
let noticeTimer=null;
let configTimer=null;
let weatherTimer=null;
let alertsTimer=null;
let pageRefreshTimer=null;
let activeNoticeIndex=0;
let weatherBusy=false;
let alertsBusy=false;
let hourlyUrl='';
let stationsUrl='';
let stationId='';
let lastBackgroundMinute=-1;

const $=id=>document.getElementById(id);
const cacheKey='display-weather-v1';
const alertCacheKey='display-alerts-v1';

const ICONS={
  sun:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.42"/></svg>`,
  cloud:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>`,
  partly:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v2M4.93 4.93l1.42 1.42M2 12h2M19.07 4.93l-1.41 1.42"/><path d="M12 8a4 4 0 0 0-3.78 2.7"/><path d="M17.5 21H9a6 6 0 1 1 5.78-7.6h2.72a3.8 3.8 0 1 1 0 7.6Z"/></svg>`,
  rain:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 17H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="m8 20-1 2M13 20l-1 2M18 20l-1 2"/></svg>`,
  snow:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 16H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M8 20h.01M12 19h.01M16 20h.01"/></svg>`,
  storm:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 16H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="m13 16-3 5h4l-2 3"/></svg>`,
  fog:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.5 14H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><path d="M4 18h16M7 22h10"/></svg>`,
  wind:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 8h12.5a3.5 3.5 0 1 0-3.5-3.5M3 12h17M3 16h11a3 3 0 1 1-3 3"/></svg>`,
  humidity:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2.7 6.6 9a8 8 0 1 0 10.8 0L12 2.7Z"/></svg>`,
  sunrise:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v8M8 6l4-4 4 4M4 18h16M6 15a6 6 0 0 1 12 0"/></svg>`,
  sunset:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 10V2M8 6l4 4 4-4M4 18h16M6 15a6 6 0 0 1 12 0"/></svg>`
};

function weatherIcon(description=''){
  const s=description.toLowerCase();
  if(s.includes('thunder'))return ICONS.storm;
  if(s.includes('snow')||s.includes('sleet')||s.includes('flurr'))return ICONS.snow;
  if(s.includes('rain')||s.includes('shower')||s.includes('drizzle'))return ICONS.rain;
  if(s.includes('fog')||s.includes('mist')||s.includes('haze'))return ICONS.fog;
  if(s.includes('partly')||s.includes('mostly'))return ICONS.partly;
  if(s.includes('cloud')||s.includes('overcast'))return ICONS.cloud;
  return ICONS.sun;
}

document.querySelectorAll('[data-icon]').forEach(el=>el.innerHTML=ICONS[el.dataset.icon]||'');

const fetchJson=async(url,timeout=12000)=>{
  const c=new AbortController();
  const t=setTimeout(()=>c.abort(),timeout);
  try{
    const r=await fetch(url,{headers:{Accept:'application/geo+json'},cache:'no-store',signal:c.signal});
    if(!r.ok)throw new Error(`${r.status} ${r.statusText}`);
    return await r.json();
  }finally{clearTimeout(t)}
};

function setStatus(type,text){
  $('status').className='status '+(type||'');
  $('statusText').textContent=text;
}

function fmtTime(d,tz){
  if(!d||Number.isNaN(new Date(d).getTime()))return'--:--';
  return new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date(d));
}

function updateClock(){
  const tz=CONFIG.timeZone||'America/Denver';
  const now=new Date();
  const parts=new Intl.DateTimeFormat('en-US',{timeZone:tz,hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(now);
  const get=t=>parts.find(p=>p.type===t)?.value||'00';
  $('time').textContent=`${get('hour')}:${get('minute')}`;
  $('seconds').textContent=get('second');
  $('date').textContent=new Intl.DateTimeFormat('en-US',{timeZone:tz,weekday:'long',month:'long',day:'numeric',year:'numeric'}).format(now);
}

function youtubeId(v=''){
  v=v.trim();
  if(/^[\w-]{11}$/.test(v))return v;
  try{
    const u=new URL(v);
    if(u.hostname.includes('youtu.be'))return u.pathname.split('/').filter(Boolean)[0]||'';
    if(u.pathname.startsWith('/embed/')||u.pathname.startsWith('/live/'))return u.pathname.split('/')[2]||'';
    return u.searchParams.get('v')||'';
  }catch{return''}
}

function setVideo(){
  const f=$('videoFrame'),fb=$('videoFallback'),id=youtubeId(CONFIG.youtubeUrl||'');
  if(!CONFIG.showVideo||!id){
    f.removeAttribute('src');
    f.style.display='none';
    fb.style.display='flex';
    return;
  }
  f.style.display='block';
  fb.style.display='none';
  f.src=`https://www.youtube.com/embed/${id}?autoplay=1&mute=1&controls=0&playsinline=1&rel=0&loop=1&playlist=${id}`;
}

function activeNotices(){
  const now=Date.now();
  const rank={urgent:0,important:1,normal:2};
  return(CONFIG.notices||[])
    .filter(n=>n.message?.trim()&&(!n.start||new Date(n.start).getTime()<=now)&&(!n.expires||new Date(n.expires).getTime()>now))
    .sort((a,b)=>(rank[a.priority||'normal']??2)-(rank[b.priority||'normal']??2));
}

function escapeHtml(s){
  return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
}

function formatNoticeExpiration(value){
  if(!value)return'';
  const date=new Date(value);
  if(Number.isNaN(date.getTime()))return'';

  const tz=CONFIG.timeZone||'America/Denver';
  const now=new Date();

  const datePart=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,
    month:'short',
    day:'numeric'
  }).format(date);

  const timePart=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,
    hour:'2-digit',
    minute:'2-digit',
    hourCycle:'h23'
  }).format(date);

  const todayPart=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,
    year:'numeric',
    month:'2-digit',
    day:'2-digit'
  }).format(now);

  const expDayPart=new Intl.DateTimeFormat('en-US',{
    timeZone:tz,
    year:'numeric',
    month:'2-digit',
    day:'2-digit'
  }).format(date);

  return todayPart===expDayPart
    ? `Expires ${timePart}`
    : `Expires ${datePart} · ${timePart}`;
}

function renderNoticeStack(){
  const list=activeNotices();
  const banner=$('noticeBanner');
  const track=$('noticeTrack');
  const count=$('noticeCount');
  const expiration=$('noticeExpiration');

  if(!list.length || CONFIG.showNoticeManager===false){
    banner.classList.remove('active');
    track.innerHTML='';
    count.textContent='';
    expiration.textContent='';
    activeNoticeIndex=0;
    return;
  }

  banner.classList.add('active');

  activeNoticeIndex=Math.max(0,Math.min(activeNoticeIndex,list.length-1));

  track.innerHTML=list.map((n,i)=>
    `<div class="notice-item ${escapeHtml(n.priority||'normal')} ${i===activeNoticeIndex?'active':''}" data-index="${i}">
      <span>${escapeHtml(n.message)}</span>
    </div>`
  ).join('');

  requestAnimationFrame(()=>positionNoticeStack(false));
  count.textContent=list.length>1?`${activeNoticeIndex+1} of ${list.length}`:'';
  expiration.textContent=formatNoticeExpiration(list[activeNoticeIndex]?.expires);
}

function positionNoticeStack(animate=true){
  const track=$('noticeTrack');
  const items=[...track.querySelectorAll('.notice-item')];
  if(!items.length)return;

  activeNoticeIndex=Math.max(0,Math.min(activeNoticeIndex,items.length-1));
  const active=items[activeNoticeIndex];

  items.forEach((item,i)=>item.classList.toggle('active',i===activeNoticeIndex));

  if(!animate)track.style.transition='none';

  const offset=-(active.offsetTop+active.offsetHeight/2);
  track.style.setProperty('--notice-offset',`${offset}px`);

  if(!animate){
    requestAnimationFrame(()=>{
      requestAnimationFrame(()=>track.style.transition='');
    });
  }
}

function advanceNotice(){
  const list=activeNotices();

  if(!list.length || CONFIG.showNoticeManager===false){
    renderNoticeStack();
    return;
  }

  if($('noticeTrack').children.length!==list.length){
    activeNoticeIndex=0;
    renderNoticeStack();
    return;
  }

  activeNoticeIndex=(activeNoticeIndex+1)%list.length;
  positionNoticeStack(true);
  $('noticeCount').textContent=list.length>1?`${activeNoticeIndex+1} of ${list.length}`:'';
  $('noticeExpiration').textContent=formatNoticeExpiration(list[activeNoticeIndex]?.expires);
}

function startNoticeRotation(){
  clearInterval(noticeTimer);
  if(CONFIG.showNoticeManager===false)return;
  activeNoticeIndex=0;
  renderNoticeStack();

  const seconds=10;
  noticeTimer=setInterval(advanceNotice,seconds*1000);
}

async function loadConfig(initial=false){
  try{
    const r=await fetch(`config.json?v=${Date.now()}`,{cache:'no-store'});
    if(!r.ok)throw new Error(r.status);
    const text=await r.text();
    if(text===currentConfigText&&!initial)return;
    currentConfigText=text;
    CONFIG=JSON.parse(text);
    setVideo();

    const noticeEnabled=CONFIG.showNoticeManager!==false;

    if(noticeEnabled){
      startNoticeRotation();
    }else{
      clearInterval(noticeTimer);
      renderNoticeStack();
    }
    updateDynamicBackground(true);
    if(!initial)scheduleRefreshTimers();
    if(initial||!hourlyUrl)await refreshWeather(true);
  }catch(e){
    console.error('Config',e);
    if(!Object.keys(CONFIG).length)setStatus('error','CONFIG ERROR');
  }
}

const cToF=c=>Math.round(c*9/5+32);
const kphToMph=k=>Math.round(k*.621371);
const dir=d=>{
  if(d==null)return'--';
  return['N','NE','E','SE','S','SW','W','NW'][Math.round(d/45)%8];
};

function solar(date,lat,lon,rise){
  const N=Math.floor((Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate())-Date.UTC(date.getUTCFullYear(),0,0))/86400000);
  const lng=lon/15;
  const t=N+((rise?6:18)-lng)/24;
  const M=.9856*t-3.289;
  const L=(M+1.916*Math.sin(M*Math.PI/180)+.020*Math.sin(2*M*Math.PI/180)+282.634+360)%360;
  const RA=(Math.atan(.91764*Math.tan(L*Math.PI/180))*180/Math.PI+360)%360;
  const RAh=(RA+(Math.floor(L/90)*90-Math.floor(RA/90)*90))/15;
  const sinDec=.39782*Math.sin(L*Math.PI/180);
  const cosDec=Math.cos(Math.asin(sinDec));
  const cosH=(Math.cos(90.833*Math.PI/180)-sinDec*Math.sin(lat*Math.PI/180))/(cosDec*Math.cos(lat*Math.PI/180));
  if(Math.abs(cosH)>1)return null;
  const H=(rise?360-Math.acos(cosH)*180/Math.PI:Math.acos(cosH)*180/Math.PI)/15;
  const T=H+RAh-.06571*t-6.622;
  const UT=(T-lng+24)%24;
  return new Date(Date.UTC(date.getUTCFullYear(),date.getUTCMonth(),date.getUTCDate(),Math.floor(UT),Math.round((UT%1)*60)));
}

function renderWeather(w,cached=false){
  $('temperature').textContent=w.tempF==null?'--°F':`${w.tempF}°F`;
  $('condition').textContent=w.description||'Weather unavailable';
  $('currentIcon').innerHTML=weatherIcon(w.description||'');
  $('wind').textContent=w.wind||'--';
  $('humidity').textContent=w.humidity==null?'--%':`${Math.round(w.humidity)}%`;
  $('updated').textContent=`Updated ${w.updated?fmtTime(w.updated,CONFIG.timeZone):'--:--'}`;

  const lat=CONFIG.location?.latitude,lon=CONFIG.location?.longitude;
  if(Number.isFinite(lat)&&Number.isFinite(lon)){
    $('sunrise').textContent=fmtTime(solar(new Date(),lat,lon,true),CONFIG.timeZone);
    $('sunset').textContent=fmtTime(solar(new Date(),lat,lon,false),CONFIG.timeZone);
  }

  setStatus(cached?'delayed':'',cached?'DELAYED':'LIVE');
}

async function refreshWeather(force=false){
  if(weatherBusy)return;
  const lat=CONFIG.location?.latitude,lon=CONFIG.location?.longitude;
  if(!Number.isFinite(lat)||!Number.isFinite(lon)){
    setStatus('error','LOCATION REQUIRED');
    return;
  }

  weatherBusy=true;
  try{
    if(force||!hourlyUrl||!stationsUrl){
      const p=await fetchJson(`https://api.weather.gov/points/${lat},${lon}`);
      hourlyUrl=p.properties.forecastHourly;
      stationsUrl=p.properties.observationStations;
      if(p.properties.timeZone&&!CONFIG.timeZone)CONFIG.timeZone=p.properties.timeZone;
    }

    const [hourly,stations]=await Promise.all([
      fetchJson(hourlyUrl),
      stationId?Promise.resolve(null):fetchJson(stationsUrl)
    ]);

    if(!stationId){
      stationId=stations?.features?.[0]?.properties?.stationIdentifier||'';
    }

    const obs=stationId?await fetchJson(`https://api.weather.gov/stations/${stationId}/observations/latest`):null;
    const op=obs?.properties||{};
    const present=hourly?.properties?.periods?.[0]||{};
    const tempC=op.temperature?.value;
    const windKph=op.windSpeed?.value;
    const humidity=op.relativeHumidity?.value;

    const w={
      tempF:tempC==null?present.temperature:cToF(tempC),
      description:op.textDescription||present.shortForecast,
      wind:windKph==null?`${present.windSpeed||'--'} ${present.windDirection||''}`.trim():`${kphToMph(windKph)} mph ${dir(op.windDirection?.value)}`,
      humidity,
      updated:op.timestamp||new Date().toISOString()
    };

    localStorage.setItem(cacheKey,JSON.stringify(w));
    renderWeather(w,false);
    updateDynamicBackground(true);
  }catch(e){
    console.error('Weather',e);
    const c=localStorage.getItem(cacheKey);
    if(c)renderWeather(JSON.parse(c),true);
    else{
      setStatus('error','CONNECTION ERROR');
      $('condition').textContent='Weather unavailable';
    }
  }finally{weatherBusy=false}
}

function classifyAlert(a){
  const s=(a.severity||'').toLowerCase(),e=(a.event||'').toLowerCase();
  if(s==='extreme'||s==='severe'||e.includes('warning'))return'warning';
  if(e.includes('watch'))return'watch';
  if(e.includes('advisory'))return'advisory';
  return'';
}

function renderAlerts(list,cached=false){
  const el=$('alerts');
  if(!list.length){
    el.className='alerts';
    el.innerHTML='<div class="alert-title">No active weather alerts</div><div class="alert-detail"></div>';
    return;
  }

  const a=list[0];
  el.className=`alerts ${classifyAlert(a)}`;
  el.innerHTML=`<div class="alert-title">${escapeHtml(a.event||'Weather Alert')}</div><div class="alert-detail">${escapeHtml(a.headline||'')}${cached?' · Delayed':''}</div>`;
}

async function refreshAlerts(){
  if(alertsBusy)return;
  const lat=CONFIG.location?.latitude,lon=CONFIG.location?.longitude;
  if(!Number.isFinite(lat)||!Number.isFinite(lon))return;

  alertsBusy=true;
  try{
    const d=await fetchJson(`https://api.weather.gov/alerts/active?point=${lat},${lon}&status=actual`);
    const list=(d.features||[]).map(f=>f.properties||{});
    localStorage.setItem(alertCacheKey,JSON.stringify(list));
    renderAlerts(list,false);
  }catch(e){
    console.error('Alerts',e);
    const c=localStorage.getItem(alertCacheKey);
    if(c)renderAlerts(JSON.parse(c),true);
    else $('alerts').innerHTML='<div class="alert-title">Weather alerts unavailable</div><div class="alert-detail"></div>';
  }finally{alertsBusy=false}
}

function scheduleRefreshTimers(){
  clearInterval(configTimer);
  clearInterval(weatherTimer);
  clearInterval(alertsTimer);
  clearTimeout(pageRefreshTimer);

  // Fixed refresh schedule.
  configTimer=setInterval(()=>loadConfig(false),30*60*1000);
  weatherTimer=setInterval(()=>refreshWeather(false),10*60*1000);
  alertsTimer=setInterval(refreshAlerts,5*60*1000);
  pageRefreshTimer=setTimeout(()=>location.reload(),30*60*1000);
}

window.addEventListener('resize',()=>{
  requestAnimationFrame(()=>positionNoticeStack(false));
});

function init(){
  const wc=localStorage.getItem(cacheKey),ac=localStorage.getItem(alertCacheKey);
  if(wc)renderWeather(JSON.parse(wc),true);
  if(ac)renderAlerts(JSON.parse(ac),true);

  updateClock();
  updateDynamicBackground(true);
  setInterval(()=>{
    updateClock();
    updateDynamicBackground(false);
  },1000);

  loadConfig(true).then(()=>{
    refreshAlerts();
    scheduleRefreshTimers();
  });
}

init();
</script>

  font-size:clamp(26px,4.2cqw,39px) !important;
  margin-top:clamp(28px,3.2vh,46px) !important;
  text-align:center !important;
  line-height:1.2 !important;
}

/* Video owns its column and cannot be underlapped by the clock. */
.video-panel,
.video-shell{
  min-width:0 !important;
  max-width:100% !important;
}

/* =========================================================
   DYNAMIC BACKGROUND
   ========================================================= */
body{
  --sky-top:#020916;
  --sky-bottom:#020b18;
  --sky-glow:rgba(101,199,247,.035);
  background:
    radial-gradient(circle at 18% 9%,var(--sky-glow),transparent 36%),
    linear-gradient(180deg,var(--sky-top) 0%,var(--sky-bottom) 100%) !important;
}

@property --sky-top{
  syntax:"<color>";
  inherits:true;
  initial-value:#020916;
}
@property --sky-bottom{
  syntax:"<color>";
  inherits:true;
  initial-value:#020b18;
}
@property --sky-glow{
  syntax:"<color>";
  inherits:true;
  initial-value:rgba(101,199,247,.035);
}

body{
  transition:
    --sky-top 60s linear,
    --sky-bottom 60s linear,
    --sky-glow 60s linear;
}

@media(max-width:1500px){
  main{
    grid-template-columns:minmax(0,.92fr) minmax(440px,1.08fr) !important;
    gap:30px !important;
  }
  .clock-panel{
    padding-left:34px !important;
  }
  #time{
    font-size:clamp(105px,27cqw,225px) !important;
    letter-spacing:.03em !important;
  }
  #seconds{
    font-size:clamp(28px,6.8cqw,54px) !important;
    margin-left:10px !important;
  }
}

@media(max-width:1100px){
  main{
    grid-template-columns:minmax(0,.9fr) minmax(380px,1.1fr) !important;
    gap:22px !important;
  }
  .clock-panel{
    padding-left:24px !important;
  }
  #time{
    font-size:clamp(88px,25cqw,180px) !important;
  }
}
